[project]
name = "scamworld"
version = "1.1.0"
description = "Interactive environment for evaluating web agents against online fraud: 430 tasks on rebuilt scam and legitimate websites"
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "Apache-2.0"}
# Runtime: pinned to the versions used for the paper's runs (Python 3.12); the full list of pinned packages is below.
dependencies = [
    "agentlab",
    "browsergym-experiments",
    "beautifulsoup4==4.15.0",
    "browsergym-core==0.14.3",
    "browsergym-webarena==0.14.3",
    "cryptography==50.0.2",
    "dataclasses-json==0.6.7",
    "deepdiff==9.1.0",
    "gitpython==3.2.0",
    "gymnasium==1.4.0",
    "ipython==9.17.1",
    "lxml==5.4.0",
    "nltk==3.10.3",
    "numpy==2.5.4",
    "pandas==2.3.3",
    "pillow==12.3.0",
    "playwright==1.44.0",
    "python-dotenv==1.2.4",
    "python-slugify==9.1.3",
    "tiktoken==0.12.0",
    "typer==0.27.3",
]

[project.scripts]
scamworld = "scamworld.cli:main"

[dependency-groups]
# Plotting and statistics packages for analysing run results; not needed to run tasks.
analysis = [
    "matplotlib>=3.8",
    "statsmodels",
]
dev = [
    "pytest",
]
# Used only by the release build, whose code is not part of this repository; not needed to run tasks.
migrate = [
    "tree-sitter==0.26.0",
    "tree-sitter-css==0.25.0",
    "tree-sitter-html==0.23.2",
    "tree-sitter-javascript==0.25.0",
]

[tool.uv]
default-groups = ["analysis", "dev"]
# In the paper's runs browsergym-webarena was installed without its dependencies (nothing imports it at run time);
# the impossible marker drops libwebarena and its model stack (transformers, openai, datasets) the same way.
override-dependencies = ["libwebarena; sys_platform == 'never'"]
# Every package version of the paper's runs (Python 3.12), also used by deploy/docker.
# uv resolves every shared package to these versions.
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "asttokens==3.0.2",
    "attrs==26.1.0",
    "beautifulsoup4==4.15.0",
    "browsergym-core==0.14.3",
    "browsergym-webarena==0.14.3",
    "cachebox==5.2.3",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "cloudpickle==3.1.2",
    "cryptography==50.0.2",
    "dataclasses-json==0.6.7",
    "deepdiff==9.1.0",
    "defusedxml==0.7.1",
    "executing==2.3.0",
    "Farama-Notifications==0.0.6",
    "gitdb==4.0.12",
    "GitPython==3.2.0",
    "greenlet==3.0.3",
    "gymnasium==1.4.0",
    "h11==0.16.0",
    "httpcore2==2.13.1",
    "httpx2==2.13.1",
    "idna==3.20",
    "ipython==9.17.1",
    "ipython_pygments_lexers==1.1.1",
    "jedi==0.20.0",
    "joblib==1.6.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "lxml==5.4.0",

    "mypy_extensions==1.1.0",
    "nltk==3.10.3",
    "numpy==2.5.4",
    "opentelemetry-api==1.45.1",
    "orderly-set==5.5.0",
    "packaging==26.3",
    "pandas==2.3.3",
    "parso==0.8.7",
    "pexpect==4.9.0",
    "pillow==12.3.0",

[tool.uv.sources]
agentlab = { path = "vendor/agentlab", editable = true }
browsergym-experiments = { path = "vendor/browsergym-experiments", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scamworld"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["browser: needs a real browser (run one at a time; SCAMWORLD_BROWSER_TESTS=1)", "slow: sweeps the whole corpus"]

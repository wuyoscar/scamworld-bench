# AgentLab (ServiceNow, Apache-2.0) at commit 8488c564eea0525aaff5dea189bb03a9b529546e, src/ only.
# Upstream declares heavy optional stacks (torch, ray, gradio, litellm); ScamWorld uses agentlab.agents and
# agentlab.llm only, so dependencies are declared by the scamworld project instead (pinned there).
[project]
name = "agentlab"
version = "0.0.0+8488c564"
requires-python = ">=3.11,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]
